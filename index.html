<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEXICO — 영어 단어 학습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14201a;
      --ink-soft: #3d4f44;
      --paper: #eef2ea;
      --paper-2: #e4ebe0;
      --leaf: #2f6b4f;
      --leaf-deep: #1d4735;
      --moss: #8faf6b;
      --sun: #e8a23a;
      --mist: rgba(20, 32, 26, 0.08);
      --radius: 18px;
      --shadow: 0 18px 40px rgba(20, 32, 26, 0.12);
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Figtree", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(143, 175, 107, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 10%, rgba(232, 162, 58, 0.18), transparent 50%),
        linear-gradient(160deg, #f4f7f1 0%, var(--paper) 45%, var(--paper-2) 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(20, 32, 26, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 32, 26, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    .wrap {
      position: relative;
      width: min(1080px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 3rem;
    }

    /* —— Hero —— */
    .hero {
      min-height: calc(100vh - 2.5rem);
      display: grid;
      align-content: center;
      gap: 1.75rem;
      padding: 2rem 0 3rem;
      animation: rise 0.9s ease both;
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 10vw, 6.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.92;
      color: var(--leaf-deep);
    }

    .brand span {
      color: var(--sun);
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 3.2vw, 2rem);
      font-weight: 500;
      max-width: 18ch;
      line-height: 1.25;
      color: var(--ink);
    }

    .hero p {
      max-width: 36ch;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--ink-soft);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--leaf-deep);
      color: #f5f8f2;
      box-shadow: 0 10px 24px rgba(29, 71, 53, 0.28);
    }

    .btn-primary:hover {
      background: var(--leaf);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid rgba(20, 32, 26, 0.2);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.45);
    }

    .hero-visual {
      position: absolute;
      right: -2%;
      top: 12%;
      width: min(420px, 48vw);
      aspect-ratio: 1;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
    }

    .orb-a {
      inset: 12% 18% 28% 22%;
      background: radial-gradient(circle at 30% 30%, #c8dcb0, #6f9b78 55%, #1d4735 100%);
      animation: float 7s ease-in-out infinite;
      opacity: 0.9;
    }

    .orb-b {
      width: 38%;
      height: 38%;
      right: 8%;
      bottom: 10%;
      background: radial-gradient(circle at 40% 35%, #f0c878, #e8a23a 70%);
      animation: float 5.5s ease-in-out infinite reverse;
      opacity: 0.85;
    }

    .word-orbit {
      position: absolute;
      inset: 0;
      animation: spin 28s linear infinite;
    }

    .word-orbit span {
      position: absolute;
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 1.6vw, 1.15rem);
      color: var(--leaf-deep);
      opacity: 0.55;
      white-space: nowrap;
    }

    .word-orbit span:nth-child(1) { top: 8%; left: 42%; }
    .word-orbit span:nth-child(2) { top: 35%; right: 0; }
    .word-orbit span:nth-child(3) { bottom: 18%; left: 18%; }
    .word-orbit span:nth-child(4) { top: 58%; left: 5%; }

    @media (max-width: 820px) {
      .hero-visual {
        position: relative;
        width: min(280px, 70vw);
        margin: 0.5rem 0 0 auto;
        top: auto;
        right: auto;
      }
      .hero {
        min-height: auto;
        padding-top: 1.5rem;
      }
    }

    /* —— Study —— */
    .study {
      display: none;
      animation: rise 0.55s ease both;
    }

    .study.active {
      display: block;
    }

    .hero.hidden {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .topbar .brand-mini {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--leaf-deep);
      letter-spacing: -0.02em;
    }

    .topbar .brand-mini span {
      color: var(--sun);
    }

    .modes {
      display: flex;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.55);
      padding: 0.3rem;
      border-radius: 999px;
      border: 1px solid rgba(20, 32, 26, 0.08);
    }

    .mode-btn {
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .mode-btn.active {
      background: var(--leaf-deep);
      color: #f5f8f2;
    }

    .progress-block {
      margin-bottom: 1.25rem;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--ink-soft);
      margin-bottom: 0.45rem;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(20, 32, 26, 0.1);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--leaf), var(--moss));
      transition: width 0.35s ease;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* Flashcard */
    .card-stage {
      perspective: 1200px;
      max-width: 560px;
      margin: 0 auto;
    }

    .flashcard {
      position: relative;
      width: 100%;
      min-height: 320px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      border: none;
      background: transparent;
      padding: 0;
      text-align: left;
      font: inherit;
      color: inherit;
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem;
      border-radius: var(--radius);
      backface-visibility: hidden;
      box-shadow: var(--shadow);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.92), rgba(244, 247, 241, 0.95));
      border: 1px solid rgba(20, 32, 26, 0.06);
    }

    .face.back {
      transform: rotateY(180deg);
      background:
        linear-gradient(145deg, #1d4735, #2f6b4f);
      color: #f5f8f2;
    }

    .pos {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .face.back .pos {
      opacity: 0.7;
      color: #c8dcb0;
    }

    .word {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      text-align: center;
    }

    .meaning {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4.5vw, 2.2rem);
      font-weight: 500;
      text-align: center;
    }

    .example {
      font-size: 1rem;
      line-height: 1.5;
      text-align: center;
      max-width: 28ch;
      opacity: 0.85;
    }

    .hint {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      opacity: 0.5;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.35rem;
      flex-wrap: wrap;
    }

    .btn-know {
      background: var(--leaf);
      color: #f5f8f2;
    }

    .btn-know:hover {
      background: var(--leaf-deep);
    }

    .btn-again {
      background: #fff;
      color: var(--ink);
      border: 1.5px solid rgba(20, 32, 26, 0.15);
    }

    .btn-again:hover {
      background: #f7f3ea;
    }

    /* Quiz */
    .quiz-card {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.75rem;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(20, 32, 26, 0.06);
      box-shadow: var(--shadow);
    }

    .quiz-prompt {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 0.6rem;
    }

    .quiz-word {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 1.4rem;
      letter-spacing: -0.03em;
    }

    .choices {
      display: grid;
      gap: 0.65rem;
    }

    .choice {
      width: 100%;
      text-align: left;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1.5px solid rgba(20, 32, 26, 0.12);
      background: rgba(255, 255, 255, 0.7);
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    .choice:hover:not(:disabled) {
      border-color: var(--leaf);
      transform: translateX(4px);
    }

    .choice.correct {
      background: rgba(47, 107, 79, 0.12);
      border-color: var(--leaf);
      color: var(--leaf-deep);
    }

    .choice.wrong {
      background: rgba(180, 60, 40, 0.1);
      border-color: #b43c28;
      color: #8a2e20;
    }

    .choice:disabled {
      cursor: default;
    }

    .quiz-feedback {
      min-height: 1.5rem;
      margin-top: 1rem;
      font-weight: 600;
      color: var(--leaf-deep);
    }

    .quiz-next {
      margin-top: 1rem;
      display: none;
    }

    .quiz-next.show {
      display: inline-flex;
    }

    /* List */
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
    }

    .word-item {
      padding: 1rem 1.1rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(20, 32, 26, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: rise 0.5s ease both;
    }

    .word-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(20, 32, 26, 0.08);
    }

    .word-item.mastered {
      border-color: rgba(47, 107, 79, 0.35);
      background: rgba(47, 107, 79, 0.08);
    }

    .word-item .en {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .word-item .ko {
      color: var(--ink-soft);
      font-size: 0.95rem;
    }

    .word-item .tag {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--leaf);
    }

    .done-banner {
      display: none;
      max-width: 560px;
      margin: 0 auto 1.25rem;
      padding: 1.1rem 1.25rem;
      border-radius: 14px;
      background: linear-gradient(120deg, rgba(47, 107, 79, 0.15), rgba(232, 162, 58, 0.15));
      border: 1px solid rgba(47, 107, 79, 0.2);
      text-align: center;
    }

    .done-banner.show {
      display: block;
      animation: rise 0.45s ease both;
    }

    .done-banner strong {
      font-family: var(--font-display);
      font-size: 1.25rem;
      display: block;
      margin-bottom: 0.25rem;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero" id="hero">
      <div class="hero-visual" aria-hidden="true">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="word-orbit">
          <span>resilient</span>
          <span>curious</span>
          <span>vivid</span>
          <span>genuine</span>
        </div>
      </div>
      <p class="brand">LEXI<span>CO</span></p>
      <h1>하루에 조금씩, 영어 단어가 내 것이 된다</h1>
      <p>카드를 넘기고, 퀴즈로 확인하고, 익힌 단어를 쌓아 보세요. 짧고 집중된 학습을 위해 만들었습니다.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="startBtn" type="button">학습 시작</button>
        <button class="btn btn-ghost" id="browseBtn" type="button">단어 목록 보기</button>
      </div>
    </section>

    <section class="study" id="study">
      <div class="topbar">
        <div class="brand-mini">LEXI<span>CO</span></div>
        <div class="modes" role="tablist" aria-label="학습 모드">
          <button class="mode-btn active" data-mode="flash" type="button">플래시카드</button>
          <button class="mode-btn" data-mode="quiz" type="button">퀴즈</button>
          <button class="mode-btn" data-mode="list" type="button">목록</button>
        </div>
      </div>

      <div class="progress-block">
        <div class="progress-meta">
          <span id="progressLabel">진행도</span>
          <span id="progressCount">0 / 0</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="done-banner" id="doneBanner">
        <strong>오늘 세션 완료</strong>
        <span>익힌 단어를 목록에서 다시 확인하거나, 퀴즈로 복습해 보세요.</span>
      </div>

      <div class="panel active" id="panel-flash" role="tabpanel">
        <div class="card-stage">
          <button class="flashcard" id="flashcard" type="button" aria-label="카드 뒤집기">
            <div class="face front">
              <span class="pos" id="flashPos">noun</span>
              <span class="word" id="flashWord">word</span>
              <span class="hint">탭하여 뜻 보기</span>
            </div>
            <div class="face back">
              <span class="pos" id="flashPosBack">noun</span>
              <span class="meaning" id="flashMeaning">의미</span>
              <span class="example" id="flashExample">example</span>
            </div>
          </button>
        </div>
        <div class="card-actions">
          <button class="btn btn-again" id="againBtn" type="button">다시 볼래요</button>
          <button class="btn btn-know" id="knowBtn" type="button">알았어요</button>
        </div>
      </div>

      <div class="panel" id="panel-quiz" role="tabpanel">
        <div class="quiz-card">
          <p class="quiz-prompt">다음 단어의 뜻은?</p>
          <h2 class="quiz-word" id="quizWord">word</h2>
          <div class="choices" id="choices"></div>
          <p class="quiz-feedback" id="quizFeedback"></p>
          <button class="btn btn-primary quiz-next" id="quizNext" type="button">다음 문제</button>
        </div>
      </div>

      <div class="panel" id="panel-list" role="tabpanel">
        <div class="word-grid" id="wordGrid"></div>
      </div>
    </section>
  </div>

  <script>
    const WORDS = [
      { en: "resilient", ko: "회복력 있는, 탄력적인", pos: "adj", example: "She stayed resilient after the setback." },
      { en: "curious", ko: "호기심 많은", pos: "adj", example: "A curious mind asks better questions." },
      { en: "vivid", ko: "생생한, 선명한", pos: "adj", example: "He shared a vivid memory of childhood." },
      { en: "genuine", ko: "진실한, 진짜의", pos: "adj", example: "Her smile looked genuine." },
      { en: "ambition", ko: "야망, 포부", pos: "noun", example: "Ambition drove him to start over." },
      { en: "hesitate", ko: "망설이다", pos: "verb", example: "Don't hesitate to ask for help." },
      { en: "precise", ko: "정확한, 정밀한", pos: "adj", example: "Please give a precise answer." },
      { en: "thrive", ko: "번창하다, 잘 자라다", pos: "verb", example: "Plants thrive with sunlight." },
      { en: "subtle", ko: "미묘한, 섬세한", pos: "adj", example: "There was a subtle change in tone." },
      { en: "persuade", ko: "설득하다", pos: "verb", example: "Can you persuade them to join?" },
      { en: "outcome", ko: "결과, 성과", pos: "noun", example: "We waited for the final outcome." },
      { en: "abandon", ko: "포기하다, 버리다", pos: "verb", example: "They had to abandon the plan." },
      { en: "frequent", ko: "빈번한", pos: "adj", example: "He makes frequent trips abroad." },
      { en: "essential", ko: "필수적인", pos: "adj", example: "Sleep is essential for health." },
      { en: "occur", ko: "일어나다, 발생하다", pos: "verb", example: "Accidents can occur anytime." },
      { en: "benefit", ko: "이익, 혜택", pos: "noun", example: "Exercise has many benefits." },
      { en: "approach", ko: "접근하다; 접근법", pos: "verb/noun", example: "Try a different approach." },
      { en: "sufficient", ko: "충분한", pos: "adj", example: "Is there sufficient time left?" },
      { en: "maintain", ko: "유지하다", pos: "verb", example: "Maintain a steady pace." },
      { en: "indicate", ko: "나타내다, 가리키다", pos: "verb", example: "The signs indicate rain." }
    ];

    const state = {
      mastered: new Set(JSON.parse(localStorage.getItem("lexico-mastered") || "[]")),
      flashIndex: 0,
      queueIndex: 0,
      quizAnswered: false,
      flipped: false
    };

    const hero = document.getElementById("hero");
    const study = document.getElementById("study");
    const flashcard = document.getElementById("flashcard");
    const progressFill = document.getElementById("progressFill");
    const progressCount = document.getElementById("progressCount");
    const progressLabel = document.getElementById("progressLabel");
    const doneBanner = document.getElementById("doneBanner");

    function saveMastered() {
      localStorage.setItem("lexico-mastered", JSON.stringify([...state.mastered]));
    }

    function updateProgress() {
      const total = WORDS.length;
      const done = state.mastered.size;
      const pct = Math.round((done / total) * 100);
      progressFill.style.width = pct + "%";
      progressCount.textContent = `${done} / ${total}`;
      progressLabel.textContent = done === total ? "모두 익힘" : "익힌 단어";
      doneBanner.classList.toggle("show", done === total && done > 0);
    }

    function remainingFlashWords() {
      const left = WORDS.filter((w) => !state.mastered.has(w.en));
      return left.length ? left : WORDS;
    }

    function renderFlash() {
      const pool = remainingFlashWords();
      if (state.flashIndex >= pool.length) state.flashIndex = 0;
      const w = pool[state.flashIndex];
      state.flipped = false;
      flashcard.classList.remove("flipped");
      document.getElementById("flashPos").textContent = w.pos;
      document.getElementById("flashPosBack").textContent = w.pos;
      document.getElementById("flashWord").textContent = w.en;
      document.getElementById("flashMeaning").textContent = w.ko;
      document.getElementById("flashExample").textContent = w.example;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderQuiz() {
      const w = WORDS[state.quizIndex % WORDS.length];
      state.quizAnswered = false;
      document.getElementById("quizWord").textContent = w.en;
      document.getElementById("quizFeedback").textContent = "";
      document.getElementById("quizNext").classList.remove("show");

      const wrongs = shuffle(WORDS.filter((x) => x.en !== w.en)).slice(0, 3).map((x) => x.ko);
      const options = shuffle([w.ko, ...wrongs]);
      const box = document.getElementById("choices");
      box.innerHTML = "";
      options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.textContent = opt;
        btn.addEventListener("click", () => onChoice(btn, opt, w));
        box.appendChild(btn);
      });
    }

    function onChoice(btn, opt, word) {
      if (state.quizAnswered) return;
      state.quizAnswered = true;
      const choices = [...document.querySelectorAll(".choice")];
      choices.forEach((c) => {
        c.disabled = true;
        if (c.textContent === word.ko) c.classList.add("correct");
      });
      const feedback = document.getElementById("quizFeedback");
      if (opt === word.ko) {
        btn.classList.add("correct");
        feedback.textContent = "정답이에요!";
        state.mastered.add(word.en);
        saveMastered();
        updateProgress();
        renderList();
      } else {
        btn.classList.add("wrong");
        feedback.textContent = `아쉬워요. 정답은 “${word.ko}” 입니다.`;
      }
      document.getElementById("quizNext").classList.add("show");
    }

    function renderList() {
      const grid = document.getElementById("wordGrid");
      grid.innerHTML = "";
      WORDS.forEach((w, i) => {
        const el = document.createElement("article");
        el.className = "word-item" + (state.mastered.has(w.en) ? " mastered" : "");
        el.style.animationDelay = `${i * 0.03}s`;
        el.innerHTML = `
          <div class="en">${w.en}</div>
          <div class="ko">${w.ko}</div>
          ${state.mastered.has(w.en) ? '<span class="tag">익힘</span>' : `<span class="tag" style="color:var(--ink-soft)">${w.pos}</span>`}
        `;
        grid.appendChild(el);
      });
    }

    function openStudy(mode) {
      hero.classList.add("hidden");
      study.classList.add("active");
      setMode(mode || "flash");
      updateProgress();
      renderFlash();
      renderQuiz();
      renderList();
    }

    function setMode(mode) {
      document.querySelectorAll(".mode-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      document.getElementById("panel-" + mode).classList.add("active");
    }

    document.getElementById("startBtn").addEventListener("click", () => openStudy("flash"));
    document.getElementById("browseBtn").addEventListener("click", () => openStudy("list"));

    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => setMode(btn.dataset.mode));
    });

    flashcard.addEventListener("click", () => {
      state.flipped = !state.flipped;
      flashcard.classList.toggle("flipped", state.flipped);
    });

    document.getElementById("knowBtn").addEventListener("click", () => {
      const pool = remainingFlashWords();
      const w = pool[state.flashIndex];
      state.mastered.add(w.en);
      saveMastered();
      updateProgress();
      renderList();
      const nextPool = remainingFlashWords();
      state.flashIndex = state.flashIndex % Math.max(nextPool.length, 1);
      renderFlash();
    });

    document.getElementById("againBtn").addEventListener("click", () => {
      const pool = remainingFlashWords();
      state.flashIndex = (state.flashIndex + 1) % pool.length;
      renderFlash();
    });

    document.getElementById("quizNext").addEventListener("click", () => {
      state.quizIndex = (state.quizIndex + 1) % WORDS.length;
      renderQuiz();
    });

    updateProgress();
  </script>
</body>
</html>
